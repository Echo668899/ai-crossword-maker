name: Deploy Cloudflare

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/consumer/**"
      - "apps/web/**"
      - "db/migrations/**"
      - "packages/**"
      - "scripts/cf-*.sh"
      - "docs/DEPLOYMENT.md"
      - ".github/workflows/deploy-cloudflare.yml"

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "BLOCKED: repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required."
            echo "Add them under GitHub → Settings → Secrets, then re-run this workflow."
            echo "See docs/DEPLOY_CHECKLIST.md"
            exit 1
          fi
          echo "Cloudflare secrets present (values not printed)."

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLIC_SITE_URL: https://aicrosswordmaker.com
        run: |
          chmod +x scripts/cf-*.sh
          # Bootstrap is idempotent-ish; safe if resources already exist.
          ./scripts/cf-bootstrap.sh || true
          ./scripts/cf-deploy.sh
