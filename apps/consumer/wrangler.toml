name = "acm-consumer"
main = "src/index.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "acm"
database_id = "a6f3ee2d-b883-4995-b1cc-e7afe0e9bb27"
migrations_dir = "../../db/migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "acm-private"

[[queues.consumers]]
queue = "acm-jobs"
max_batch_size = 5
max_retries = 3
