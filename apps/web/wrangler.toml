# Optional Workers Static Assets deploy for the Astro SSG output.
# Preferred path in docs/DEPLOYMENT.md is Cloudflare Pages (`acm-web`) via:
#   pnpm --filter @acm/api exec wrangler pages deploy apps/web/dist --project-name=acm-web
# Pages Advanced Mode uses dist/_worker.js (copied from public/_worker.js) to
# rewrite /p/:token and pack/edit shells. Use this file only if you intentionally
# serve dist from a Worker instead of Pages.
name = "acm-web"
main = "public/_worker.js"
compatibility_date = "2025-10-01"

[assets]
directory = "./dist"
binding = "ASSETS"
# Real 404s — do not SPA-fallback missing HTML routes.
not_found_handling = "404-page"
html_handling = "auto"
# Invoke the rewrite worker before 404.html for tokenized shells.
run_worker_first = ["/p/*", "/app/packs/*", "/app/puzzles/*"]
