name = "acm-api"
main = "src/index.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]

# Same-origin API on the production host (zone must live in this account).
[[routes]]
pattern = "crosswordmaker.app/api/*"
zone_name = "crosswordmaker.app"

[[routes]]
pattern = "www.crosswordmaker.app/api/*"
zone_name = "crosswordmaker.app"

# Local D1 for durable anon AI quota. Production: replace database_id after `wrangler d1 create acm`.
[[d1_databases]]
binding = "DB"
database_name = "acm"
database_id = "a6f3ee2d-b883-4995-b1cc-e7afe0e9bb27"
migrations_dir = "../../db/migrations"

# Private pack ZIP exports (local Miniflare simulates the bucket).
[[r2_buckets]]
binding = "FILES"
bucket_name = "acm-private"

[[queues.producers]]
binding = "JOBS"
queue = "acm-jobs"

[vars]
PUBLIC_SITE_URL = "https://crosswordmaker.app"
AI_ENABLED = "true"
AI_ANON_DEMO_ENABLED = "true"
AI_MAX_RETRIES = "2"
PLAN_VERSION = "2026-10-31.hybrid.v1"
# Billing: auto prefers Creem when CREEM_* secrets + product ids are set; else Stripe.
# Force with BILLING_PROVIDER=creem|stripe.
BILLING_PROVIDER = "auto"
# Live Creem API (test mode: https://test-api.creem.io). Non-secret base URL only.
CREEM_API_BASE = "https://api.creem.io"
# Prefer secrets / .dev.vars for OPENAI_*; do not commit keys.
OPENAI_MODEL_GENERATE = "gpt-4.1-mini"
OPENAI_MODEL_REWRITE = "gpt-4.1-mini"
# Turnstile: set TURNSTILE_SECRET_KEY in secrets; hostnames for siteverify checks.
TURNSTILE_REQUIRED = "false"
TURNSTILE_HOSTNAMES = "crosswordmaker.app,localhost,127.0.0.1"
TURNSTILE_ACTION = "ai-topic"
# Comma-separated admin emails (prefer secret/var in production). Empty denies /admin API.
# ADMIN_EMAILS = "ops@example.com"
# Magic-link mail (production): set RESEND_API_KEY via secret; verify MAIL_FROM domain in Resend.
MAIL_PROVIDER = "resend"
MAIL_FROM = "noreply@crosswordmaker.app"
MAIL_FROM_NAME = "Crossword Maker"
