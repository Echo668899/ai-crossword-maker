name = "acm-api"
main = "src/index.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]

# Local D1 for durable anon AI quota. Production: replace database_id after `wrangler d1 create acm`.
[[d1_databases]]
binding = "DB"
database_name = "acm"
database_id = "a6f3ee2d-b883-4995-b1cc-e7afe0e9bb27"
migrations_dir = "../../db/migrations"

# Private pack ZIP exports (local Miniflare simulates the bucket).
[[r2_buckets]]
binding = "FILES"
bucket_name = "acm-private"

[[queues.producers]]
binding = "JOBS"
queue = "acm-jobs"

[vars]
PUBLIC_SITE_URL = "https://aicrosswordmaker.com"
AI_ENABLED = "false"
AI_ANON_DEMO_ENABLED = "true"
AI_MAX_RETRIES = "2"
PLAN_VERSION = "2026-10-31.hybrid.v1"
# Prefer secrets / .dev.vars for OPENAI_*; do not commit keys.
OPENAI_MODEL_GENERATE = "gpt-4.1-mini"
OPENAI_MODEL_REWRITE = "gpt-4.1-mini"
# Turnstile: set TURNSTILE_SECRET_KEY in secrets; hostnames for siteverify checks.
TURNSTILE_REQUIRED = "false"
TURNSTILE_HOSTNAMES = "aicrosswordmaker.com,localhost,127.0.0.1"
TURNSTILE_ACTION = "ai-topic"
# Comma-separated admin emails (prefer secret/var in production). Empty denies /admin API.
# ADMIN_EMAILS = "ops@example.com"
